[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "example-compose-monitor"
version = "0.1.0"
description = "Example: a read-only DevOps monitor for Docker Compose services, with Telegram alerts"
requires-python = ">=3.11"
dependencies = ["apexai-devops-sdk>=0.1,<0.2"]

# The engine loads a host through this entry point.
[project.entry-points."apexai_ops.hosts"]
runtime = "compose_monitor.wiring:runtime"

[tool.hatch.build.targets.wheel]
packages = ["compose_monitor"]
